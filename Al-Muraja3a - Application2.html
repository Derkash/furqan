document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

o JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — rounded frame: everything softens, small controls go pill — */\n.card, .dialog { border-radius: calc(var(--radius-lg) * 1.15); }\n.btn, .tag, .seg, .input { border-radius: rs de série<\u002Fdiv><\u002Fdiv>\n    <div class=\"card elev-sm\" style=\"align-items:center;text-align:center\"><div style=\"font-family:var(--font-heading);font-size:30px;color:var(--color-accent-2-800)\">412<\u002Fdiv><div style=\"font-size:12.5px;color:var(--color-neutral-600)\">versets révisés<\u002Fdiv><\u002Fdiv>\n    <div class=\"card elev-sm\" style=\"align-items:center;text-align:center\"><div style=\"font-family:var(--font-heading);font-size:30px;color:var(--color-accent-2-800)\">91%<\u002Fdiv><div style=\"font-size:12.5px;color:var(--color-neutral-600)\">de précision<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-top:16px\">\n    <div class=\"card elev-sm\" style=\"padding:24px\">\n      <div class=\"card-kicker\">Cette semaine · minutes<\u002Fdiv>\n      <div style=\"display:flex;align-items:flex-end;gap:14px;height:150px;margin-top:12px\">\n        <sc-for list=\"{{ weekBars }}\" as=\"b\" hint-placeholder-count=\"7\">\n          <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:flex-end\">\n            <div style=\"width:100%;max-width:44px;border-radius:999px;background:{{ b.bg }};height:{{ b.h }}\"><\u002Fdiv>\n            <span style=\"font-size:11.5px;color:var(--color-neutral-600);font-weight:700\">{{ b.d }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:14px\">\n      <div class=\"elev-sm\" style=\"background:var(--color-accent-2-800);border-radius:calc(var(--radius-lg)*1.15);padding:22px;flex:1;display:flex;flex-direction:column;justify-content:center\">\n        <div style=\"font-size:10.5px;letter-spacing:.16em;font-weight:700;color:var(--color-accent-2-400)\">EN COURS<\u002Fdiv>\n        <div style=\"font-family:var(--font-heading);font-size:20px;color:var(--color-accent-2-100);margin-top:6px\">Sourate Al-Kahf<\u002Fdiv>\n        <div style=\"font-size:13px;color:var(--color-accent-2-300);margin-top:3px\">62 / 110 versets consolidés<\u002Fdiv>\n        <div style=\"height:8px;border-radius:99px;background:var(--color-accent-2-700);margin-top:12px;position:relative\"><div style=\"position:absolute;left:0;top:0;bottom:0;width:56%;border-radius:99px;background:var(--color-accent)\"><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"card elev-sm\"><div class=\"card-kicker\">Prochain jalon<\u002Fdiv><div class=\"card-body\">Encore 3 jours de régularité pour atteindre <strong>1 mois de série<\u002Fstrong>.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isReglages }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"Réglages\" style=\"animation:fadeUp .3s ease\">\n  <h1 style=\"font-size:30px;margin:0;color:var(--color-accent-2-900)\">Réglages<\u002Fh1>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px;max-width:900px\">\n    <div class=\"elev-sm\" style=\"background:var(--color-surface);border-radius:calc(var(--radius-lg)*1.15);overflow:hidden\">\n      <div style=\"padding:17px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--color-divider)\">\n        <div><div style=\"font-size:14px;font-weight:700\">Rappel quotidien<\u002Fdiv><div style=\"font-size:12px;color:var(--color-neutral-600);margin-top:1px\">Tous les jours à 08:00<\u002Fdiv><\u002Fdiv>\n        <div sc-camel-on-click=\"{{ toggleRappel }}\" style=\"flex:none;width:46px;height:28px;border-radius:99px;cursor:pointer;position:relative;transition:background .2s ease;background:{{ tRappelBg }}\"><div style=\"position:absolute;top:2.5px;left:2.5px;width:23px;height:23px;border-radius:99px;background:#fff;box-shadow:var(--shadow-sm);transition:transform .2s ease;transform:translateX({{ tRappelX }})\"><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:17px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--color-divider)\">\n        <div><div style=\"font-size:14px;font-weight:700\">Lecture automatique<\u002Fdiv><div style=\"font-size:12px;color:var(--color-neutral-600);margin-top:1px\">Passer au verset suivant<\u002Fdiv><\u002Fdiv>\n        <div sc-camel-on-click=\"{{ toggleAuto }}\" style=\"flex:none;width:46px;height:28px;border-radius:99px;cursor:pointer;position:relative;transition:background .2s ease;background:{{ tAutoBg }}\"><div style=\"position:absolute;top:2.5px;left:2.5px;width:23px;height:23px;border-radius:99px;background:#fff;box-shadow:var(--shadow-sm);transition:transform .2s ease;transform:translateX({{ tAutoX }})\"><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:17px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px\">\n        <div style=\"font-size:14px;font-weight:700\">Masquage par défaut en récitation<\u002Fdiv>\n        <span class=\"tag tag-accent-2\">Activé<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"elev-sm\" style=\"background:var(--color-surface);border-radius:calc(var(--radius-lg)*1.15);overflow:hidden\">\n      <div style=\"padding:17px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--color-divider)\">\n        <div style=\"font-size:14px;font-weight:700\">Récitateur<\u002Fdiv><span style=\"font-size:13px;color:var(--color-neutral-600)\">{{ reciter }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"padding:17px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--color-divider)\">\n        <div style=\"font-size:14px;font-weight:700\">Objectif quotidien<\u002Fdiv><span style=\"font-size:13px;color:var(--color-neutral-600)\">{{ goal }} min / jour<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"padding:17px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px\">\n        <div style=\"font-size:14px;font-weight:700\">À propos d’Al-Muraja3a<\u002Fdiv><span style=\"font-size:13px;color:var(--color-neutral-500)\">v1.0<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n\n<sc-if value=\"{{ hasToast }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:absolute;bottom:26px;left:50%;transform:translateX(-50%);background:var(--color-accent-2-900);color:var(--color-accent-2-100);font-size:13.5px;font-weight:600;padding:12px 24px;border-radius:999px;box-shadow:var(--shadow-lg);animation:fadeUp .25s ease;z-index:40\">{{ toast }}<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;: {&quot;width&quot;: 1330, &quot;height&quot;: 970}, &quot;dailyGoal&quot;: {&quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 30, &quot;min&quot;: 10, &quot;max&quot;: 120, &quot;unit&quot;: &quot;min&quot;, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Objectif&quot;}, &quot;reciter&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;Mishary Al-Afasy&quot;, &quot;options&quot;: [&quot;Mishary Al-Afasy&quot;, &quot;Abdul Basit&quot;, &quot;Saad Al-Ghamidi&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Audio&quot;}, &quot;showTranslit&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Adhkâr&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    screen: 'onboarding', ob: 0, goalPick: 30, reciterPick: null,\n    playing: false, audioOpen: true, speed: '1×', repeat: 'Aucun', autoNext: true,\n    selLeft: null, matched: {}, wrong: null,\n    query: '', dhikrIdx: 0, counts: [0, 0, 0], dhikrTab: 'fr',\n    rappel: true, vIdx: 0, maskOn: true, revealed: false, evals: {}, toast: ''\n  };\n  go(s) { this.setState({ screen: s }); }\n  showToast(msg) {\n    clearTimeout(this._tt);\n    this.setState({ toast: msg });\n    this._tt = setTimeout(() => this.setState({ toast: '' }), 2200);\n  }\n  renderVals() {\n    const S = this.state, set = (o) => this.setState(o);\n    const goal = S.goalPick ?? (this.props.dailyGoal ?? 30);\n    const reciter = S.reciterPick ?? (this.props.reciter ?? 'Mishary Al-Afasy');\n    const sage100 = 'var(--color-accent-2-100)', sage300 = 'var(--color-accent-2-300)', sage700 = 'var(--color-accent-2-700)', sage800 = 'var(--color-accent-2-800)';\n    const surface = 'var(--color-surface)', acc = 'var(--color-accent)', acc100 = 'var(--color-accent-100)';\n    const ICONS = {\n      home: 'M3 10.5L12 3l9 7.5M5 9.5V21h14V9.5',\n      rev: 'M3 12a9 9 0 1 0 2.6-6.3M3 3v5h5',\n      book: 'M2 5h7a3 3 0 0 1 3 3v13a3 3 0 0 0-3-3H2zM22 5h-7a3 3 0 0 0-3 3v13a3 3 0 0 1 3-3h7z',\n      vocab: 'M4 4h7v7H4zM13 13h7v7h-7zM11 11l2 2',\n      search: 'M21 21l-4.3-4.3M17 10.5a6.5 6.5 0 1 1-13 0 6.5 6.5 0 0 1 13 0z',\n      sun: 'M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z',\n      chart: 'M5 20v-8M12 20V6M19 20v-4',\n      cog: 'M4 8h10M18 8h2M14 5v6M4 16h2M10 16h10M8 13v6',\n      mic: 'M12 3a3 3 0 0 1 3 3v5a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3zM6 11a6 6 0 0 0 12 0M12 17v4',\n      ear: 'M4 10v4M9 6v12M14 8v8M19 4v16'\n    };\n    const NAV = [\n      ['Accueil', 'accueil', ICONS.home], ['Révision', 'revision', ICONS.rev], ['Lecture', 'lecture', ICONS.book],\n      ['Vocabulaire', 'vocab', ICONS.vocab], ['Index', 'index', ICONS.search], ['Adhkâr', 'adhkar', ICONS.sun],\n      ['Progression', 'progression', ICONS.chart], ['Réglages', 'reglages', ICONS.cog]\n    ];\n    const activeKey = S.screen === 'recitation' ? 'revision' : S.screen;\n    const navItems = NAV.map(([label, key, d]) => ({\n      label, d,\n      bg: key === activeKey ? sage100 : 'transparent',\n      hbg: sage100,\n      c: key === activeKey ? sage800 : 'var(--color-neutral-400)',\n      onTap: () => this.go(key)\n    }));\n    // Onboarding\n    const obNext = () => { if (S.ob >= 2) this.go('accueil'); else set({ ob: S.ob + 1 }); };\n    const goalOpts = [15, 30, 50].map(v => ({\n      v, bg: S.goalPick === v ? sage100 : 'var(--color-bg)',\n      bd: S.goalPick === v ? sage700 : 'transparent', onPick: () => set({ goalPick: v })\n    }));\n    const RECITERS = ['Mishary Al-Afasy', 'Abdul Basit', 'Saad Al-Ghamidi'];\n    const curReciter = S.reciterPick ?? RECITERS[0];\n    const reciterOpts = RECITERS.map(name => ({\n      name, initial: name.charAt(0),\n      bg: curReciter === name ? sage100 : 'var(--color-bg)',\n      bd: curReciter === name ? sage700 : 'transparent',\n      onPick: () => set({ reciterPick: name })\n    }));\n    // Vocab\n    const PAIRS = [\n      { fr: 'Patience', ar: 'صَبْر' }, { fr: 'Miséricorde', ar: 'رَحْمَة' }, { fr: 'Science', ar: 'عِلْم' },\n      { fr: 'Pardon', ar: 'عَفْو' }, { fr: 'Gratitude', ar: 'شُكْر' }, { fr: 'Sincérité', ar: 'إِخْلَاص' },\n      { fr: 'Confiance', ar: 'تَوَكُّل' }, { fr: 'Justice', ar: 'عَدْل' }\n    ];\n    const RIGHT = [2, 0, 4, 1, 5, 3, 7, 6];\n    const rowStyle = (i, side) => {\n      const m = S.matched[i], sel = side === 'l' && S.selLeft === i;\n      const wr = S.wrong && S.wrong[side] === i;\n      if (wr) return { bg: acc100, bd: 'var(--color-accent-600)' };\n      if (m) return { bg: sage100, bd: sage300 };\n      if (sel) return { bg: acc100, bd: acc };\n      return { bg: surface, bd: 'transparent' };\n    };\n    const pickLeft = (i) => { if (!S.matched[i]) set({ selLeft: S.selLeft === i ? null : i }); };\n    const pickRight = (pi) => {\n      if (S.matched[pi] || S.selLeft == null) return;\n      if (S.selLeft === pi) {\n        set({ matched: { ...S.matched, [pi]: true }, selLeft: null });\n      } else {\n        const w = { l: S.selLeft, r: pi };\n        set({ wrong: w, selLeft: null });\n        clearTimeout(this._wt);\n        this._wt = setTimeout(() => this.setState({ wrong: null }), 650);\n      }\n    };\n    const leftRows = PAIRS.map((p, i) => ({ label: p.fr, onPick: () => pickLeft(i), ...rowStyle(i, 'l') }));\n    const rightRows = RIGHT.map(pi => ({\n      label: PAIRS[pi].ar, ok: !!S.matched[pi], onPick: () => pickRight(pi), ...rowStyle(pi, 'r')\n    }));\n    const vocabScore = Object.keys(S.matched).length;\n    const midDots = PAIRS.map((_, i) => ({ bg: S.matched[i] ? sage700 : 'var(--color-neutral-300)' }));\n    // Recitation (verse-only — never the full spread)\n    const FATIHA = [\n      ['بِسْمِ اللَّهِ الرَّحْمَـٰنِ الرَّحِيمِ', 'Au nom d\\u2019Allah, le Tout Miséricordieux, le Très Miséricordieux.'],\n      ['الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ', 'Louange à Allah, Seigneur de l\\u2019univers.'],\n      ['الرَّحْمَـٰنِ الرَّحِيمِ', 'Le Tout Miséricordieux, le Très Miséricordieux.'],\n      ['مَالِكِ يَوْمِ الدِّينِ', 'Maître du Jour de la rétribution.'],\n      ['إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ', 'C\\u2019est Toi seul que nous adorons, et c\\u2019est Toi seul dont nous implorons secours.'],\n      ['اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ', 'Guide-nous dans le droit chemin.'],\n      ['صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ', 'Le chemin de ceux que Tu as comblés de faveurs, non pas de ceux qui ont encouru Ta colère, ni des égarés.']\n    ];\n    const AR_NUMS = ['١', '٢', '٣', '٤', '٥', '٦', '٧'];\n    const vGo = (i) => set({ vIdx: Math.max(0, Math.min(6, i)), revealed: false });\n    const doEval = (ok) => {\n      set({ evals: { ...S.evals, [S.vIdx]: ok } });\n      this.showToast(ok ? 'Verset validé — qu\\u2019Allah vous récompense' : 'Marqué « à revoir » — il reviendra plus souvent');\n      setTimeout(() => vGo(this.state.vIdx + 1), 500);\n    };\n    const vDots = FATIHA.map((_, i) => ({\n      bg: i === S.vIdx ? acc : (S.evals[i] === true ? sage700 : (S.evals[i] === false ? 'var(--color-accent-300)' : 'var(--color-neutral-300)'))\n    }));\n    // Adhkar\n    const ADHKAR = [\n      {\n        ar: 'أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَـٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ',\n        fr: 'Nous voici au matin, et la royauté appartient à Allah. Louange à Allah. Nul n\\u2019est digne d\\u2019adoration sauf Allah, Seul, sans associé. À Lui la royauté, à Lui la louange, et Il est capable de toute chose.',\n        tr: 'Asbahnâ wa asbaha-l-mulku li-Llâh, wa-l-hamdu li-Llâh, lâ ilâha illâ-Llâhu wahdahu lâ sharîka lah, lahu-l-mulku wa lahu-l-hamdu wa huwa \\u2018alâ kulli shay\\u2019in qadîr.',\n        src: 'Rapporté par Muslim', target: 1\n      },\n      {\n        ar: 'سُبْحَانَ اللَّهِ وَبِحَمْدِهِ',\n        fr: 'Gloire et louange à Allah.',\n        tr: 'Subhâna-Llâhi wa bi-hamdih.',\n        src: 'Rapporté par Muslim · 100 fois', target: 100\n      },\n      {\n        ar: 'حَسْبِيَ اللَّهُ لَا إِلَـٰهَ إِلَّا هُوَ، عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ',\n        fr: 'Allah me suffit. Nul n\\u2019est digne d\\u2019adoration sauf Lui. En Lui je place ma confiance, et Il est le Seigneur du Trône immense.',\n        tr: 'Hasbiya-Llâhu lâ ilâha illâ huwa, \\u2018alayhi tawakkaltu wa huwa rabbu-l-\\u2018arshi-l-\\u2018azîm.',\n        src: 'Rapporté par Abû Dâwud · 7 fois', target: 7\n      }\n    ];\n    const dk = ADHKAR[S.dhikrIdx];\n    const showTranslit = this.props.showTranslit ?? true;\n    const tabs = [['fr', 'Français']].concat(showTranslit ? [['tr', 'Translittération']] : []);\n    const dhikrTabs = tabs.map(([k, label]) => ({\n      label, bg: S.dhikrTab === k ? sage800 : 'var(--color-bg)',\n      c: S.dhikrTab === k ? 'var(--color-accent-2-100)' : 'var(--color-neutral-600)',\n      onPick: () => set({ dhikrTab: k })\n    }));\n    const dGo = (i) => set({ dhik olor-accent-700)', onStart: () => this.go('recitation') },\n      { title: 'Lecture & écoute', desc: 'Lisez le mushaf en suivant la récitation de votre récitateur.', d: ICONS.book, badge: false, btnClass: 'btn-secondary', bd: 'transparent', iconBg: sage100, iconC: sage800, onStart: () => this.go('lecture') },\n      { title: 'Quiz audio', desc: 'Écoutez un verset et retrouvez sa suite parmi plusieurs propositions.', d: ICONS.ear, badge: false, btnClass: 'btn-secondary', bd: 'transparent', iconBg: sage100, iconC: sage800, onStart: () => this.showToast('Quiz audio — bientôt disponible dans le prototype') },\n      { title: 'Correspondances', desc: 'Reliez le vocabulaire coranique français–arabe pour ancrer le sens.', d: ICONS.vocab, badge: false, btnClass: 'btn-secondary', bd: 'transparent', iconBg: sage100, iconC: sage800, onStart: () => this.go('vocab') }\n    ];\n    const toggle = (on) => ({ bg: on ? sage700 : 'var(--color-neutral-300)', x: on ? '18px' : '0px' });\n    const tR = toggle(S.rappel), tA = toggle(S.autoNext), tM = toggle(S.maskOn);\n    return {\n      isOnboarding: S.screen === 'onboarding', inApp: S.screen !== 'onboarding',\n      isAccueil: S.screen === 'accueil', isRevision: S.screen === 'revision', isLecture: S.screen === 'lecture',\n      isRecitation: S.screen === 'recitation', isVocab: S.screen === 'vocab', isIndex: S.screen === 'index',\n      isAdhkar: S.screen === 'adhkar', isProgression: S.screen === 'progression', isReglages: S.screen === 'reglages',\n      navItems, quickLinks, modes, goal, reciter, reciterInitial: reciter.charAt(0),\n      ob0: S.ob === 0, ob1: S.ob === 1, ob2: S.ob === 2,\n      obDots: [0, 1, 2].map(i => ({ bg: i === S.ob ? 'var(--color-accent)' : 'var(--color-neutral-300)' })),\n      obNext, obNextLabel: S.ob === 2 ? 'C\\u2019est parti' : 'Continuer', obSkip: () => this.go('accueil'),\n      goalOpts, reciterOpts,\n      goAccueil: () => this.go('accueil'), goRevision: () => this.go('revision'), goRecitation: () => this.go('recitation'),\n      playing: S.playing, notPlaying: !S.playing, togglePlay: () => set({ playing: !S.playing }),\n      audioOpen: S.audioOpen, toggleAudioPanel: () => set({ audioOpen: !S.audioOpen }),\n      speedOpts: mkOpts(['0.75×', '1×', '1.25×', '1.5×'], S.speed, 'speed'),\n      repeatOpts: mkOpts(['Aucun', 'Verset', 'Sourate'], S.repeat, 'repeat'),\n      toggleAuto: () => set({ autoNext: !S.autoNext }), tAutoBg: tA.bg, tAutoX: tA.x,\n      leftRows, rightRows, midDots, vocabScore, vocabDone: vocabScore === 8,\n      vocabReset: () => set({ matched: {}, selLeft: null, wrong: null }),\n      verseAr: FATIHA[S.vIdx][0], verseFr: FATIHA[S.vIdx][1], verseMark: '﴿' + AR_NUMS[S.vIdx] + '﴾',\n      vNum: S.vIdx + 1, vPos: (S.vIdx + 1) + ' / 7', vDots,\n      showVerse: !S.maskOn || S.revealed, showMask: S.maskOn && !S.revealed,\n      toggleMask: () => set({ maskOn: !S.maskOn, revealed: false }), tMaskBg: tM.bg, tMaskX: tM.x,\n      reveal: () => set({ revealed: true }),\n      prevVerse: () => vGo(S.vIdx - 1), nextVerse: () => vGo(S.vIdx + 1),\n      evalOk: () => doEval(true), evalKo: () => doEval(false),\n      listenVerse: () => this.showToast('Lecture du verset ' + (S.vIdx + 1) + ' — ' + reciter),\n      query: S.query, onQuery: (e) => set({ query: e.target.value }), indexRows,\n      dhikrAr: dk.ar, dhikrBody: S.dhikrTab === 'tr' ? dk.tr : dk.fr, dhikrSource: dk.src,\n      dhikrPos: (S.dhikrIdx + 1) + ' / 3', dhikrTabs,\n      dhikrCount: S.counts[S.dhikrIdx] + ' / ' + dk.target,\n      countDhikr: () => {\n        const c = S.counts.slice();\n        if (c[S.dhikrIdx] < dk.target) c[S.dhikrIdx]++;\n        set({ counts: c });\n        if (c[S.dhikrIdx] === dk.target) this.showToast('Dhikr complété — passez au suivant');\n      },\n      prevDhikr: () => dGo(S.dhikrIdx - 1), nextDhikr: () => dGo(S.dhikrIdx + 1),\n      weekBars,\n      toggleRappel: () => set({ rappel: !S.rappel }), tRappelBg: tR.bg, tRappelX: tR.x,\n      toast: S.toast, hasToast:
